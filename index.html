    const KOREAN_HOLIDAYS = {
      '2026-01-01': '신정', '2026-02-16': '설날 연휴', '2026-02-17': '설날', '2026-02-18': '설날 연휴',
      '2026-03-01': '삼일절', '2026-03-02': '대체공휴일', '2026-05-05': '어린이날', '2026-05-24': '부처님오신날',

      '2026-09-24': '추석 연휴', '2026-09-25': '추석', '2026-09-26': '추석 연휴', '2026-10-03': '개천절',

    const formatDateToYMD = (date) => {
      if (!date) return '';
      const d = new Date(date);
      if (isNaN(d.getTime())) return '';
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    };

    const isHoliday = (date) => KOREAN_HOLIDAYS[formatDateToYMD(date)] || null;
    const isNonWorkingDay = (date) => {
      const d = new Date(date);
      return d.getDay() === 0 || d.getDay() === 6 || !!isHoliday(date);
    };

    const getNextWorkingDay = (date) => {
      const cur = new Date(date);
      cur.setHours(0, 0, 0, 0);
      while (isNonWorkingDay(cur)) cur.setDate(cur.getDate() + 1);
      return cur;
    };

    const getMondayOfDate = (d) => {
      const dt = new Date(d);
      const day = dt.getDay();
      dt.setDate(dt.getDate() - day + (day === 0 ? -6 : 1));
      dt.setHours(0, 0, 0, 0);
      return dt;
    };

    const getWeekInfo = (mondayDate) => {
      const d = new Date(mondayDate);
      d.setHours(0, 0, 0, 0);
      const sunday = new Date(d);
      sunday.setDate(d.getDate() + 6);
      const thurs = new Date(d);
      thurs.setDate(d.getDate() + 3);
      const year = thurs.getFullYear();
      const month = thurs.getMonth() + 1;

      const firstDay = new Date(year, month - 1, 1);
      let fMonDate = 1;
      const fDayWeek = firstDay.getDay();
      if (fDayWeek === 1) fMonDate = 1;
      else if (fDayWeek === 0) fMonDate = 2;
      else fMonDate = 1 + (8 - fDayWeek);
      const firstMon = new Date(year, month - 1, fMonDate);

      let weekNum = 0, targetYear = year, targetMonth = month;
      if (d < firstMon) {
        const pMonthLast = new Date(year, month - 1, 0);
        targetYear = pMonthLast.getFullYear();
        targetMonth = pMonthLast.getMonth() + 1;
        const pFirstDay = new Date(targetYear, targetMonth - 1, 1);
        let pFMonDate = 1;
        const pFDayWeek = pFirstDay.getDay();
        if (pFDayWeek === 1) pFMonDate = 1;
        else if (pFDayWeek === 0) pFMonDate = 2;
        else pFMonDate = 1 + (8 - pFDayWeek);
        const pFirstMon = new Date(targetYear, targetMonth - 1, pFMonDate);
        weekNum = Math.floor((d.getTime() - pFirstMon.getTime()) / (7 * 24 * 60 * 60 * 1000)) + 1;
      } else {
        weekNum = Math.floor((d.getTime() - firstMon.getTime()) / (7 * 24 * 60 * 60 * 1000)) + 1;
      }

      const nextMon = new Date(d);
      nextMon.setDate(d.getDate() + 7);
      const isLastWeek = nextMon.getMonth() + 1 !== targetMonth;

      return {
        year: targetYear, month: targetMonth, weekNum, isLastWeekOfMonth: isLastWeek,
        isFirstWeekOfMonth: weekNum === 1, weekKey: `${targetYear}-${String(targetMonth).padStart(2, '0')}-W${weekNum}`,
        label: `${targetYear}년 ${targetMonth}월 ${weekNum}주차`,
        rangeStr: `${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')} ~ ${String(sunday.getMonth() + 1).padStart(2, '0')}.${String(sunday.getDate()).padStart(2, '0')}`,
        monday: d, sunday
      };
    };

    const calculateProcurementFund = (val) => {
      const salary = Number(val) || 0;
      if (salary <= 0) return 0;
      let health = Math.min(Math.max(Math.floor((salary * INSURANCE_RATES_2026.healthRate) / 10) * 10, INSURANCE_RATES_2026.healthMin), INSURANCE_RATES_2026.healthMax);
      let care = Math.floor((health * INSURANCE_RATES_2026.careRateOfHealth) / 10) * 10;
      let npSalary = Math.min(Math.max(salary, INSURANCE_RATES_2026.pensionSalaryMin), INSURANCE_RATES_2026.pensionSalaryMax);
      let pension = Math.floor((npSalary * INSURANCE_RATES_2026.pensionRate) / 10) * 10;
      let emp = Math.floor((salary * INSURANCE_RATES_2026.employmentRate) / 10) * 10;
      let ind = Math.floor((salary * INSURANCE_RATES_2026.industrialRate) / 10) * 10;
      return Math.round(salary + (health + care + pension + emp + ind) + (salary / 12.0));
    };

    const computeTotalPeriod = (periods = [], activeYears = [true, true, true, true, true]) => {
      let s = '', e = '';
      periods.forEach((p, idx) => {
        if (activeYears[idx] && p) {
          const parts = p.split('~');
          if (parts[0] && (!s || parts[0].trim() < s)) s = parts[0].trim();
          if (parts[1] && parts[1].trim()) e = parts[1].trim();
        }
      });
      return s && e ? `${s} ~ ${e}` : s || '';
    };

    const BUDGET_TABLE_SCHEMA = [

    const groupSchemaByCategory = (schema) => {

        }

    const DEFAULT_LABOR_ROWS = [

    function App() {

      // --- 투두리스트 핸들러 ---

      const addTodoItem = () => {
        if (!newTodoTitle.trim()) return alert('할 일 내용을 입력해주세요.');
        const d = new Date(selectedCalendarDate);
        const startMon = getMondayOfDate(d);

        const newItem = {

          createdAt: new Date().toISOString()
        };
        setTodos([newItem, ...todos]);
        setNewTodoTitle('');
      };

      const isTodoActiveOnDate = (todo, targetDate) => {
        const todoStart = new Date(todo.baseDate || todo.createdAt);
        todoStart.setHours(0, 0, 0, 0);
        const target = new Date(targetDate);
        target.setHours(0, 0, 0, 0);
        if (target < todoStart) return false;

        if (todo.repeat === 'none') return formatDateToYMD(target) === formatDateToYMD(getNextWorkingDay(todoStart));
        if (todo.repeat === 'week') {
          const weekMon = getMondayOfDate(target);
          const orig = new Date(weekMon);
          orig.setDate(weekMon.getDate() + (todo.baseDayOfWeek === 0 ? 6 : todo.baseDayOfWeek - 1));
          return formatDateToYMD(target) === formatDateToYMD(getNextWorkingDay(orig));
        }
        if (todo.repeat === 'biweek') {
          const weekMon = getMondayOfDate(target);
          const orig = new Date(weekMon);
          orig.setDate(weekMon.getDate() + (todo.baseDayOfWeek === 0 ? 6 : todo.baseDayOfWeek - 1));
          const diffWeeks = Math.round((getMondayOfDate(orig).getTime() - getMondayOfDate(todoStart).getTime()) / (7 * 24 * 60 * 60 * 1000));
          if (diffWeeks < 0 || diffWeeks % 2 !== 0) return false;
          return formatDateToYMD(target) === formatDateToYMD(getNextWorkingDay(orig));
        }
        if (todo.repeat === 'month_date') {
          const orig = new Date(target.getFullYear(), target.getMonth(), todo.baseDayOfMonth);
          return formatDateToYMD(target) === formatDateToYMD(getNextWorkingDay(orig));
        }
        if (todo.repeat === 'month_nth_week') {
          const firstMon = getMondayOfDate(new Date(target.getFullYear(), target.getMonth(), 1));
          const targetMon = new Date(firstMon);
          targetMon.setDate(firstMon.getDate() + (todo.baseWeekNum - 1) * 7);
          const orig = new Date(targetMon);
          orig.setDate(targetMon.getDate() + (todo.baseDayOfWeek === 0 ? 6 : todo.baseDayOfWeek - 1));
          return formatDateToYMD(target) === formatDateToYMD(getNextWorkingDay(orig));
        }
        if (todo.repeat === 'year') {
          const orig = new Date(target.getFullYear(), todo.baseMonth - 1, todo.baseDayOfMonth);
          return formatDateToYMD(target) === formatDateToYMD(getNextWorkingDay(orig));
        }
        return false;
      };

      const isTodoActiveInWeek = (todo, weekInfo) => {
        for (let i = 0; i < 7; i++) {
          const dayDate = new Date(weekInfo.monday);
          dayDate.setDate(dayDate.getDate() + i);
          if (isTodoActiveOnDate(todo, dayDate)) return true;
        }
        return false;
      };

      const toggleTodoDoneInWeek = (todoId, weekKey) => {
        setTodos(todos.map(t => {
          if (t.id === todoId) {
            const nextDone = { ...(t.doneWeeks || {}) };
            if (nextDone[weekKey]) delete nextDone[weekKey];
            else nextDone[weekKey] = '2026-08-20';
            return { ...t, doneWeeks: nextDone };
          }
          return t;
        }));
      };

      const removeTodo = (id) => setTodos(todos.filter(t => t.id !== id));

      const dynamicRepeatOptions = [

      ];

      const currentWeekActiveTodos = todos.filter(t => isTodoActiveInWeek(t, curWeekInfo) && !t.doneWeeks?.[curWeekInfo.weekKey]);
      const currentWeekDoneTodos = todos.filter(t => isTodoActiveInWeek(t, curWeekInfo) && !!t.doneWeeks?.[curWeekInfo.weekKey]);

      // --- 회의비 핸들러 ---
      const addTitle = () => {

        setNewPlace('');

      const addMember = () => {
        if (!newMember.trim()) return;
        setMembers([...members, ...newMember.split(',').map(s => s.trim())]);
        setNewMember('');
      };
      const drawRandomMembers = () => {
        const count = parseInt(pickCount, 10);
        if (!count || count <= 0) return alert('올바른 인원수를 입력해주세요.');
        setPickedResult([...members].sort(() => 0.5 - Math.random()).slice(0, count).join(', '));
      };

      // 달력 렌더링
      const renderCalendar = () => {
        const year = calendarViewMonth.getFullYear();
        const month = calendarViewMonth.getMonth();
        const firstDay = new Date(year, month, 1).getDay();
        const totalDays = new Date(year, month + 1, 0).getDate();

        const days = [];
        for (let i = 0; i < firstDay; i++) days.push(null);
        for (let d = 1; d <= totalDays; d++) days.push(d);

        const weeks = [];
        for (let i = 0; i < days.length; i += 7) {
          const chunk = days.slice(i, i + 7);
          while (chunk.length < 7) chunk.push(null);
          weeks.push(chunk);
        }

        return (
          <View style={styles.calendarWrap}>
            <View style={styles.rowBetween}>
              <Text style={styles.calendarMonthTitle}>📅 {year}년 {month + 1}월 달력</Text>
              <View style={{ flexDirection: 'row', gap: 6 }}>
                <TouchableOpacity style={styles.calNavBtn} onPress={() => setCalendarViewMonth(new Date(year, month - 1, 1))}><Text style={styles.calNavText}>◀</Text></TouchableOpacity>
                <TouchableOpacity style={styles.calNavBtn} onPress={() => setCalendarViewMonth(new Date(2026, 7, 1))}><Text style={styles.calNavText}>오늘</Text></TouchableOpacity>
                <TouchableOpacity style={styles.calNavBtn} onPress={() => setCalendarViewMonth(new Date(year, month + 1, 1))}><Text style={styles.calNavText}>▶</Text></TouchableOpacity>
              </View>
            </View>

            <View style={styles.calWeekHeader}>
              {['일', '월', '화', '수', '목', '금', '토'].map((w, idx) => (
                <Text key={w} style={[styles.calWeekText, idx === 0 && { color: '#ff3b30' }, idx === 6 && { color: '#007AFF' }]}>{w}</Text>
              ))}
            </View>

            {weeks.map((week, wIdx) => (
              <View key={wIdx} style={styles.calRow}>
                {week.map((day, dIdx) => {
                  if (!day) return <View key={dIdx} style={styles.calCell} />;
                  const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                  const isSelected = selectedCalendarDate === dateStr;
                  const isToday = dateStr === TODAY_STR;
                  const cellDate = new Date(year, month, day);
                  const isRedDay = cellDate.getDay() === 0 || !!isHoliday(cellDate);
                  const activeTodosOnDay = todos.filter(t => isTodoActiveOnDate(t, cellDate));

                  return (
                    <TouchableOpacity
                      key={dIdx}
                      style={[styles.calCell, isToday && styles.calCellToday, isSelected && styles.calCellSelected]}
                      onPress={() => {
                        setSelectedCalendarDate(dateStr);
                        setCurrentMonday(getMondayOfDate(cellDate));
                      }}
                    >
                      {isToday && !isSelected && <View style={styles.todayMiniBadge}><Text style={styles.todayMiniBadgeText}>오늘</Text></View>}
                      <Text style={[styles.calDayText, isRedDay && { color: '#ff3b30', fontWeight: 'bold' }, isSelected && { color: '#fff', fontWeight: 'bold' }]}>{day}</Text>
                      {activeTodosOnDay.length > 0 && (
                        <View style={styles.calDotWrap}>
                          <View style={[styles.calDot, activeTodosOnDay.some(t => !t.doneWeeks?.[getWeekInfo(getMondayOfDate(cellDate)).weekKey]) ? styles.calDotPending : styles.calDotDone]} />
                        </View>
                      )}
                    </TouchableOpacity>
                  );
                })}
              </View>
            ))}
          </View>
        );
      };

      return (
        <View style={styles.container}>
          {/* 상단 3단 메인 탭 */}
          <View style={styles.topTabBar}>
            <TouchableOpacity style={[styles.topTabBtn, mainTab === 'clinical' && styles.topTabBtnActive]} onPress={() => setMainTab('clinical')}><Text style={[styles.topTabText, mainTab === 'clinical' && styles.topTabTextActive]}>🏥 임상연구비</Text></TouchableOpacity>
            <TouchableOpacity style={[styles.topTabBtn, mainTab === 'national' && styles.topTabBtnActive]} onPress={() => setMainTab('national')}><Text style={[styles.topTabText, mainTab === 'national' && styles.topTabTextActive]}>📑 국책연구비</Text></TouchableOpacity>
            <TouchableOpacity style={[styles.topTabBtn, mainTab === 'common' && styles.topTabBtnActive]} onPress={() => setMainTab('common')}><Text style={[styles.topTabText, mainTab === 'common' && styles.topTabTextActive]}>⚙️ 공통</Text></TouchableOpacity>
          </View>

          {/* 서브 탭 */}
          {mainTab === 'clinical' && (
            <View style={styles.subTabBar}>
              <TouchableOpacity style={[styles.subTabBtn, clinicalSubTab === 'meeting' && styles.subTabBtnActive]} onPress={() => setClinicalSubTab('meeting')}><Text style={[styles.subTabText, clinicalSubTab === 'meeting' && styles.subTabTextActive]}>📊 회의비</Text></TouchableOpacity>
              <TouchableOpacity style={[styles.subTabBtn, clinicalSubTab === 'gallery' && styles.subTabBtnActive]} onPress={() => setClinicalSubTab('gallery')}><Text style={[styles.subTabText, clinicalSubTab === 'gallery' && styles.subTabTextActive]}>🖼️ 서류</Text></TouchableOpacity>
              <TouchableOpacity style={[styles.subTabBtn, clinicalSubTab === 'search' && styles.subTabBtnActive]} onPress={() => setClinicalSubTab('search')}><Text style={[styles.subTabText, clinicalSubTab === 'search' && styles.subTabTextActive]}>✨ 비목검색</Text></TouchableOpacity>
            </View>
          )}

          {mainTab === 'common' && (
            <View style={styles.subTabBar}>
              <TouchableOpacity style={[styles.subTabBtn, commonSubTab === 'todo' && styles.subTabBtnActive]} onPress={() => setCommonSubTab('todo')}><Text style={[styles.subTabText, commonSubTab === 'todo' && styles.subTabTextActive]}>📋 투두리스트</Text></TouchableOpacity>
              <TouchableOpacity style={[styles.subTabBtn, commonSubTab === 'accounts' && styles.subTabBtnActive]} onPress={() => setCommonSubTab('accounts')}><Text style={[styles.subTabText, commonSubTab === 'accounts' && styles.subTabTextActive]}>🔐 계정관리</Text></TouchableOpacity>
              <TouchableOpacity style={[styles.subTabBtn, commonSubTab === 'search' && styles.subTabBtnActive]} onPress={() => setCommonSubTab('search')}><Text style={[styles.subTabText, commonSubTab === 'search' && styles.subTabTextActive]}>✨ 비목검색</Text></TouchableOpacity>
            </View>
          )}

          {/* 공통 -> 투두리스트 */}
          {mainTab === 'common' && commonSubTab === 'todo' && (
            <ScrollView style={styles.fluidScroll}>
              <View style={styles.card}>
                <View style={styles.rowBetween}>
                  <Text style={styles.weekMainBadge}>📅 {curWeekInfo.label}</Text>
                  <View style={{ flexDirection: 'row', gap: 6 }}>
                    <TouchableOpacity style={styles.weekNavBtn} onPress={() => { const next = new Date(currentMonday); next.setDate(next.getDate() - 7); setCurrentMonday(next); }}><Text style={styles.weekNavText}>◀ 이전 주</Text></TouchableOpacity>
                    <TouchableOpacity style={styles.weekNavBtn} onPress={() => setCurrentMonday(getMondayOfDate(new Date(2026, 7, 20)))}><Text style={styles.weekNavText}>이번 주</Text></TouchableOpacity>
                    <TouchableOpacity style={styles.weekNavBtn} onPress={() => { const next = new Date(currentMonday); next.setDate(next.getDate() + 7); setCurrentMonday(next); }}><Text style={styles.weekNavText}>다음 주 ▶</Text></TouchableOpacity>
                  </View>
                </View>

                {/* 등록 바 */}
                <View style={styles.todoInputSection}>
                  <View style={styles.categoryToggleRow}>
                    {['임상', '국책', '일반'].map(cat => (
                      <TouchableOpacity key={cat} style={[styles.categoryToggleBtn, newTodoCategory === cat && styles.catClinicalActive]} onPress={() => setNewTodoCategory(cat)}>
                        <Text style={styles.categoryToggleText}>{cat}</Text>
                      </TouchableOpacity>
                    ))}
                  </View>
                  <View style={[styles.row, { marginTop: 8 }]}>
                    <TextInput style={[styles.input, styles.fluidInput, { marginRight: 6 }]} placeholder="할 일 내용 입력..." value={newTodoTitle} onChangeText={setNewTodoTitle} onSubmitEditing={addTodoItem} />
                  </View>
                  <View style={[styles.rowBetween, { marginTop: 6, flexWrap: 'wrap', gap: 4 }]}>
                    <View style={styles.repeatToggleGroup}>
                      {dynamicRepeatOptions.map(r => (
                        <TouchableOpacity key={r.key} style={[styles.repeatBtn, newTodoRepeat === r.key && styles.repeatBtnActive]} onPress={() => setNewTodoRepeat(r.key)}>
                          <Text style={styles.repeatBtnText}>{r.label}</Text>
                        </TouchableOpacity>
                      ))}
                    </View>
                    <TouchableOpacity style={styles.btn} onPress={addTodoItem}><Text style={styles.btnText}>추가</Text></TouchableOpacity>
                  </View>
                </View>

                {/* 주간 목록 */}
                <View style={{ marginTop: 10, gap: 6 }}>
                  {currentWeekActiveTodos.map(item => (
                    <View key={item.id} style={styles.todoItemCard}>
                      <TouchableOpacity onPress={() => toggleTodoDoneInWeek(item.id, curWeekInfo.weekKey)} style={{ marginRight: 8 }}><Text style={{ fontSize: 18 }}>⬜</Text></TouchableOpacity>
                      <View style={{ flex: 1 }}>
                        <Text style={styles.todoTitle}>[{item.category}] {item.title}</Text>
                        <Text style={styles.todoDateText}>📌 적용: {curWeekInfo.label}</Text>
                      </View>
                      <TouchableOpacity onPress={() => removeTodo(item.id)}><Text style={{ color: '#888', fontWeight: 'bold' }}>✕</Text></TouchableOpacity>
                    </View>
                  ))}
                </View>
              </View>

              {/* 달력 */}
              <View style={styles.card}>
                {renderCalendar()}
              </View>
            </ScrollView>
          )}

          {/* 임상 -> 회의비 */}
          {mainTab === 'clinical' && clinicalSubTab === 'meeting' && (
            <ScrollView style={styles.fluidScroll}>
              <View style={styles.card}>
                <Text style={styles.cardHeader}>📌 회의 제목 (누르면 복사)</Text>
                <View style={styles.row}>
                  <TextInput style={[styles.input, styles.fluidInput, { marginRight: 6 }]} placeholder="회의명 입력..." value={newTitle} onChangeText={setNewTitle} />
                  <TouchableOpacity style={styles.btn} onPress={addTitle}><Text style={styles.btnText}>추가</Text></TouchableOpacity>
                </View>
                {titles.map((t, idx) => (
                  <TouchableOpacity key={idx} style={styles.listItem} onPress={() => copyToClipboard(t)}>
                    <Text style={styles.itemText}>{t}</Text>
                    <Text style={{ color: '#007AFF', fontWeight: 'bold' }}>복사</Text>
                  </TouchableOpacity>
                ))}
              </View>
              <View style={styles.card}>
                <Text style={styles.cardHeader}>👥 참여자 랜덤 추출</Text>
                <View style={styles.row}>
                  <TextInput style={[styles.input, styles.fluidInput, { marginRight: 6 }]} placeholder="참여자 명단 (쉼표 구분)..." value={newMember} onChangeText={setNewMember} />
                  <TextInput style={[styles.input, { width: 50, marginRight: 6, textAlign: 'center' }]} placeholder="수" value={pickCount} onChangeText={setPickCount} keyboardType="numeric" />
                  <TouchableOpacity style={[styles.btn, { backgroundColor: '#34c759' }]} onPress={drawRandomMembers}><Text style={styles.btnText}>뽑기</Text></TouchableOpacity>
                </View>
                {pickedResult ? (
                  <TouchableOpacity style={styles.resultBox} onPress={() => { copyToClipboard(pickedResult); setPickedResult(''); }}>
                    <Text style={{ color: '#1b5e20', fontWeight: 'bold' }}>결과: {pickedResult} (터치 시 복사)</Text>
                  </TouchableOpacity>
                ) : null}
              </View>
            </ScrollView>
          )}
        </View>
      );
    }

    const styles = StyleSheet.create({
      container: { flex: 1, backgroundColor: '#f2f2f7', paddingTop: 20, paddingHorizontal: 12 },
      fluidScroll: { flex: 1, width: '100%' },
      fluidInput: { flex: 1 },
      topTabBar: { flexDirection: 'row', backgroundColor: '#d1d1d6', borderRadius: 10, padding: 3, marginBottom: 8 },
      topTabBtn: { flex: 1, paddingVertical: 8, alignItems: 'center', borderRadius: 8 },
      topTabBtnActive: { backgroundColor: '#ffffff' },
      topTabText: { fontSize: 12, fontWeight: '600', color: '#636366' },
      topTabTextActive: { color: '#000000', fontWeight: 'bold' },
      subTabBar: { flexDirection: 'row', backgroundColor: '#e2e8f0', borderRadius: 8, padding: 2, marginBottom: 8 },
      subTabBtn: { flex: 1, paddingVertical: 6, alignItems: 'center', borderRadius: 6 },
      subTabBtnActive: { backgroundColor: '#007AFF' },
      subTabText: { fontSize: 11, fontWeight: '600', color: '#475569' },
      subTabTextActive: { color: '#ffffff', fontWeight: 'bold' },
      card: { backgroundColor: '#ffffff', padding: 12, borderRadius: 10, marginBottom: 10, borderWidth: 1, borderColor: '#e5e5ea' },
      cardHeader: { fontSize: 14, fontWeight: 'bold', marginBottom: 8 },
      row: { flexDirection: 'row', alignItems: 'center' },
      rowBetween: { flexDirection: 'row', justifyContent: 'space-between', alignItems: 'center' },
      input: { borderWidth: 1, borderColor: '#d1d1d6', borderRadius: 6, paddingHorizontal: 8, paddingVertical: 6, backgroundColor: '#fafafa', fontSize: 12 },
      btn: { backgroundColor: '#007AFF', paddingHorizontal: 12, paddingVertical: 6, justifyContent: 'center', alignItems: 'center', borderRadius: 6 },
      btnText: { color: '#fff', fontWeight: 'bold', fontSize: 12 },
      listItem: { flexDirection: 'row', alignItems: 'center', backgroundColor: '#f8f9fa', borderRadius: 6, marginTop: 4, padding: 8, borderWidth: 1, borderColor: '#e5e5ea' },
      itemText: { fontSize: 12, flex: 1 },
      resultBox: { marginTop: 8, padding: 10, backgroundColor: '#eef9f1', borderRadius: 8, alignItems: 'center' },
      weekMainBadge: { fontSize: 15, fontWeight: 'bold', color: '#007AFF' },
      weekNavBtn: { paddingHorizontal: 8, paddingVertical: 4, backgroundColor: '#f2f2f7', borderRadius: 6 },
      weekNavText: { fontSize: 11, color: '#007AFF', fontWeight: 'bold' },
      todoInputSection: { backgroundColor: '#f9f9fb', padding: 8, borderRadius: 8, marginTop: 8, borderWidth: 1, borderColor: '#e5e5ea' },
      categoryToggleRow: { flexDirection: 'row', alignItems: 'center', gap: 6 },
      categoryToggleBtn: { paddingVertical: 4, paddingHorizontal: 10, borderRadius: 6, backgroundColor: '#fff', borderWidth: 1, borderColor: '#d1d1d6' },
      catClinicalActive: { backgroundColor: '#e6f7ff', borderColor: '#91d5ff' },
      categoryToggleText: { fontSize: 11, fontWeight: 'bold', color: '#666' },
      repeatToggleGroup: { flexDirection: 'row', backgroundColor: '#f2f2f7', borderRadius: 6, padding: 2, flexWrap: 'wrap', gap: 2 },
      repeatBtn: { paddingHorizontal: 6, paddingVertical: 4, borderRadius: 4 },
      repeatBtnActive: { backgroundColor: '#007AFF' },
      repeatBtnText: { fontSize: 10, color: '#666' },
      todoItemCard: { flexDirection: 'row', alignItems: 'center', padding: 10, backgroundColor: '#f9f9fb', borderRadius: 8, borderWidth: 1, borderColor: '#e5e5ea' },
      todoTitle: { fontSize: 13, fontWeight: 'bold', color: '#1c1c1e' },
      todoDateText: { fontSize: 11, color: '#666', marginTop: 2 },
      calendarWrap: { marginTop: 8, padding: 8, backgroundColor: '#f9f9fb', borderRadius: 8, borderWidth: 1, borderColor: '#e5e5ea' },
      calendarMonthTitle: { fontSize: 13, fontWeight: 'bold' },
      calNavBtn: { paddingHorizontal: 6, paddingVertical: 3, backgroundColor: '#fff', borderRadius: 4, borderWidth: 1, borderColor: '#ccc' },
      calNavText: { fontSize: 10, fontWeight: 'bold' },
      calWeekHeader: { flexDirection: 'row', width: '100%', marginVertical: 6 },
      calWeekText: { flex: 1, textAlign: 'center', fontSize: 11, fontWeight: 'bold', color: '#666' },
      calRow: { flexDirection: 'row', width: '100%', marginVertical: 2 },
      calCell: { flex: 1, height: 38, justifyContent: 'center', alignItems: 'center', borderRadius: 6, marginHorizontal: 1, position: 'relative' },
      calCellToday: { borderWidth: 2, borderColor: '#ff9500', backgroundColor: '#fffdf5' },
      calCellSelected: { backgroundColor: '#007AFF' },
      todayMiniBadge: { position: 'absolute', top: 1, backgroundColor: '#ff9500', borderRadius: 3, paddingHorizontal: 2 },
      todayMiniBadgeText: { color: '#fff', fontSize: 7, fontWeight: 'bold' },
      calDayText: { fontSize: 12, color: '#333' },
      calDotWrap: { position: 'absolute', bottom: 3, flexDirection: 'row', justifyContent: 'center', width: '100%' },
      calDot: { width: 5, height: 5, borderRadius: 2.5 },
      calDotPending: { backgroundColor: '#ff4d4f' },
      calDotDone: { backgroundColor: '#52c41a' }
    });

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
